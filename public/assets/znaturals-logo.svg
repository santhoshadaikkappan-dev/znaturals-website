<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gold Gradient for the Leaf Highlight -->
    <linearGradient id="goldLeafGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#A67C38" />
      <stop offset="35%" stop-color="#C5A16B" />
      <stop offset="70%" stop-color="#E5D2B3" />
      <stop offset="100%" stop-color="#A67C38" />
    </linearGradient>

    <!-- Deep Botanical Forest Green -->
    <linearGradient id="forestGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#233D2E" />
      <stop offset="100%" stop-color="#182E22" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 15)">
    <!-- ======================================================== -->
    <!-- 1. ICONIC 'Z' LOGOMARK WITH CROSSING BOTANICAL LEAF     -->
    <!-- ======================================================== -->
    <g transform="translate(195, 20)">
      <!-- Top Bar of Z with Serif -->
      <path d="M 12 25 L 188 25 C 196 25 199 30 196 37 L 182 58 C 179 63 173 66 164 66 L 94 66 L 152 128 L 175 106 L 196 128 L 196 25 Z" fill="url(#forestGreenGrad)" />
      
      <!-- Bottom Bar of Z with Serif -->
      <path d="M 198 190 L 22 190 C 14 190 11 185 14 178 L 28 157 C 31 152 37 149 46 149 L 116 149 L 58 87 L 35 109 L 14 87 L 14 190 Z" fill="url(#forestGreenGrad)" />
      
      <!-- Main Diagonal Stroke of Z -->
      <path d="M 166 62 L 44 190 L 14 190 L 14 175 L 144 42 L 184 42 L 184 57 Z" fill="url(#forestGreenGrad)" />

      <!-- Botanical Leaf 1 (Top / Golden Curved Leaf) -->
      <path d="M 10 116 C 55 75 130 65 210 94 C 158 116 100 128 10 116 Z" fill="url(#goldLeafGrad)" />

      <!-- Botanical Leaf 2 (Main Lower Forest Green Leaf with Organic Curve) -->
      <path d="M 18 114 C 70 82 145 74 206 95 C 160 144 95 152 18 114 Z" fill="url(#forestGreenGrad)" />
      
      <!-- Center Leaf Vein / Division Line -->
      <path d="M 18 114 C 95 102 150 98 206 95" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- ======================================================== -->
    <!-- 2. TYPOGRAPHY: BRAND NAME                               -->
    <!-- ======================================================== -->
    <text x="300" y="275" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
          font-size="46" 
          font-weight="700" 
          letter-spacing="6" 
          fill="#1C3527">
      Z NATURALS
    </text>
    
    <!-- Registered Symbol (®) -->
    <text x="495" y="248" 
          font-family="'Inter', sans-serif" 
          font-size="12" 
          font-weight="700" 
          fill="#1C3527">
      ®
    </text>

    <!-- ======================================================== -->
    <!-- 3. SUBTITLE: FLANKED BY GOLD ACCENT LINES                -->
    <!-- ======================================================== -->
    <line x1="45" y1="304" x2="145" y2="304" stroke="#C5A16B" stroke-width="1.2" stroke-linecap="round" />
    
    <text x="300" y="308" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          letter-spacing="3.5" 
          fill="#263D32">
      BOTANICAL BEAUTY &amp; PERSONAL CARE
    </text>
    
    <line x1="455" y1="304" x2="555" y2="304" stroke="#C5A16B" stroke-width="1.2" stroke-linecap="round" />

    <!-- ======================================================== -->
    <!-- 4. OFFICIAL TAGLINE: ITALIC SERIF                        -->
    <!-- ======================================================== -->
    <text x="300" y="342" 
          text-anchor="middle" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
          font-style="italic" 
          font-size="17" 
          font-weight="500" 
          letter-spacing="0.8" 
          fill="#2B4636">
      Nature's Goodness. Your Kind of Beauty.
    </text>
  </g>
</svg>